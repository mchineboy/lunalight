name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Install C64 build tools
        run: |
          sudo add-apt-repository --yes multiverse
          sudo apt-get update
          sudo apt-get install --yes cc65 default-jre-headless vice xvfb

          # Debian removes the ROM data required by VICE. Restore the data from
          # the matching official upstream source release.
          curl --fail --location --silent --show-error \
            https://sourceforge.net/projects/vice-emu/files/releases/vice-3.7.1.tar.gz/download \
            --output /tmp/vice.tar.gz
          mkdir -p /tmp/vice-source "$HOME/.local/share/vice"
          tar -xzf /tmp/vice.tar.gz -C /tmp/vice-source --strip-components=1
          cp -R /tmp/vice-source/data/. "$HOME/.local/share/vice/"

      - name: Verify and build release artifacts
        run: |
          xvfb-run --auto-servernum make verify-blitz-gameplay d64 d64-mospeed
          test -s build/lunalight-blitz-full.prg
          test -s build/lunalight-mospeed-full.prg
          test -s build/lunalight.d64
          test -s build/lunalight-mospeed.d64
          cp build/lunalight.d64 build/lunalight-blitz.d64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(
            build/lunalight-blitz-full.prg
            build/lunalight-mospeed-full.prg
            build/lunalight-blitz.d64
            build/lunalight-mospeed.d64
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Lunalight $TAG"
          fi
