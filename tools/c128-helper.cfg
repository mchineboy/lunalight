# Phase 0 C128 gateway: fixed addresses for the vectors, the results block and
# the code so the verifier can assert them without reading a map file.
MEMORY {
    HEADER:  start = $0000, size = $0002, file = %O;
    VECT:    start = $1300, size = $0040, file = %O, fill = yes;
    RES:     start = $1340, size = $0040, file = %O, fill = yes;
    HELPER:  start = $1380, size = $0280, file = %O, fill = no;
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    VECTORS:  load = VECT,   type = rw;
    RESULTS:  load = RES,    type = rw;
    CODE:     load = HELPER, type = rw;
}
