# C128 edition: the same player assembled into the free bank-0 window that no
# ROM shadows. 492 bytes of code in the 512-byte slot at $1300.
MEMORY {
    HEADER: start = $0000, size = $0002, file = %O;
    MUSIC:  start = $1300, size = $0200, file = %O;
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    CODE:     load = MUSIC,  type = rw;
}
