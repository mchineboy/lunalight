# C128 edition: RNG code at $1500 and its 1,024-byte table page-aligned at
# $1800, both inside the free bank-0 window $1300-$1BFF.
#
# The code region deliberately stops at $177F rather than running to $17FF, so
# that ld65 refuses the link if the code grows into the scratch area instead of
# silently overwriting it. It already did once: the target-based C128 wait pushed
# the code end to exactly $1740 and clobbered the probe's result block there.
MEMORY {
    HEADER:     start = $0000, size = $0002, file = %O;
    RNGCODE:    start = $1500, size = $0280, file = %O, fill = yes;
    RNGSCRATCH: start = $1780, size = $0080, file = %O, fill = yes;
    RNGDATA:    start = $1800, size = $0400, file = %O, fill = yes;
}

SEGMENTS {
    LOADADDR: load = HEADER,  type = ro;
    CODE:     load = RNGCODE, type = rw;
    RNGTAB:   load = RNGDATA, type = rw;
}
